<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Anchor editor — HOME</title>
<style>
  html, body { margin:0; padding:0; background:#1a1c22; color:#e8e6e0; font-family: system-ui, sans-serif; height:100%; }
  #app { display:flex; height:100vh; }
  #sidebar { width:260px; flex:none; background:#22242c; padding:12px; overflow-y:auto; box-sizing:border-box; }
  #sidebar h2 { font-size:14px; text-transform:uppercase; letter-spacing:0.05em; color:#9a9a9a; margin:16px 0 6px; }
  #sidebar h2:first-child { margin-top:0; }
  .item { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; margin-bottom:2px; }
  .item:hover { background:#2e3038; }
  .item.active { background:#3a5a8a; }
  .item img { width:28px; height:28px; object-fit:contain; background:#111; border-radius:3px; }
  .item span { font-size:13px; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #toolbar { padding:8px 14px; background:#22242c; display:flex; gap:16px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #333; }
  #calbar { padding:6px 14px; background:#1e2028; display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #333; }
  #toolbar label, #calbar label { font-size:12px; color:#aaa; display:flex; align-items:center; gap:6px; }
  #toolbar input[type=number], #calbar input[type=number] { width:70px; background:#111; color:#eee; border:1px solid #444; border-radius:4px; padding:3px 6px; }
  #canvasWrap { flex:1; overflow:auto; position:relative; background:
    repeating-conic-gradient(#2a2c34 0% 25%, #24262e 0% 50%) 50% / 24px 24px; }
  #stage { position:relative; transform-origin: 0 0; }
  #stage img { display:block; pointer-events:none; }
  .marker { position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%;
    border:2px solid #ffcf6b; background:rgba(255,207,107,0.25); cursor:grab; box-shadow:0 0 0 2px rgba(0,0,0,0.6); z-index:5; }
  .marker.origin { border-color:#6bd1ff; background:rgba(107,209,255,0.25); }
  .marker:active { cursor:grabbing; }
  #calMarkers .calpt { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
    border:2px solid #7bff9e; background:rgba(123,255,158,0.3); pointer-events:none; z-index:4; }
  #gridOverlay { position:absolute; left:0; top:0; pointer-events:none; }
  #jsonPanel { height:220px; flex:none; background:#111; border-top:1px solid #333; display:flex; flex-direction:column; }
  #jsonPanel textarea { flex:1; background:#0c0c0f; color:#8fd18f; font:12px/1.4 monospace; border:none; padding:10px; resize:none; }
  #jsonPanel .bar { padding:6px 10px; display:flex; gap:8px; align-items:center; background:#181a20; flex-wrap:wrap; }
  button { background:#3a5a8a; color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; }
  button:hover { background:#4a6fae; }
  button.secondary { background:#3a3d47; }
  button.secondary:hover { background:#4a4d57; }
  button.cal { background:#2f6b45; }
  button.cal:hover { background:#3c8657; }
  button.cal.active { background:#5cbf7f; color:#111; }
  #status { font-size:12px; color:#9a9; margin-left:auto; }
  #calHint { font-size:12px; color:#7bff9e; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h2>Bútor sprite-ok</h2>
    <div id="spriteList"></div>
    <h2>Szoba plate</h2>
    <div id="roomList"></div>
    <h2>Egyéni fájl</h2>
    <div style="display:flex; gap:4px;">
      <input id="customPath" placeholder="assets/sprites/xyz.png" style="flex:1; background:#111; color:#eee; border:1px solid #444; border-radius:4px; padding:4px 6px; font-size:12px;">
      <button class="secondary" onclick="loadCustom()">+</button>
    </div>
  </div>
  <div id="main">
    <div id="toolbar">
      <strong id="currentName">—</strong>
      <label>Zoom <input type="range" id="zoom" min="0.1" max="3" step="0.05" value="1"></label>
      <label>anchor x <input type="number" id="ax" step="0.001"></label>
      <label>anchor y <input type="number" id="ay" step="0.001"></label>
      <label>scale <input type="number" id="ascale" step="0.01" value="1"></label>
      <span id="status"></span>
    </div>
    <div id="calbar">
      <label><input type="checkbox" id="showGrid"> rács előnézet</label>
      <label><span id="gridNLabel">N</span> <input type="number" id="gridN" value="6" step="1" style="width:40px;"></label>
      <label>TW <input type="number" id="gridTW" step="0.1"></label>
      <label>TH <input type="number" id="gridTH" step="0.1"></label>
      <span style="width:1px; height:18px; background:#444;"></span>
      <label>Aktív szoba (rács-ref.) <select id="activeRoom"></select></label>
      <span style="width:1px; height:18px; background:#444;"></span>
      <button class="cal" id="calBtn" onclick="toggleCalibration()">3-pontos kalibráció (csak szobánál)</button>
      <span id="calHint"></span>
    </div>
    <div id="canvasWrap">
      <div id="stage">
        <img id="img" src="">
        <canvas id="gridOverlay"></canvas>
        <div id="calMarkers"></div>
        <div class="marker" id="marker" hidden></div>
      </div>
    </div>
    <div id="jsonPanel">
      <div class="bar">
        <button onclick="loadExisting()">sprites.json betöltése (szerver)</button>
        <label class="secondary" style="background:#3a3d47; border-radius:6px; padding:6px 12px; cursor:pointer;">
          megnyitás lemezről<input type="file" id="fileOpen" accept=".json" style="display:none;">
        </label>
        <button onclick="copyJson()">JSON másolása</button>
        <button onclick="downloadJson()">Letöltés (sprites.json)</button>
        <span id="jsonStatus" style="color:#9a9; font-size:12px;"></span>
      </div>
      <textarea id="jsonOut" spellcheck="false"></textarea>
    </div>
  </div>
</div>
<script>
const SPRITES = [
  'crib','bed','nightstand','wardrobe','wardrobeEmpty','watch','box1x1','box1x2',
  'shelf1','shelf2',
  'man30_ne_stand','man30_ne_touch','man30_se_stand','man30_se_touch',
  'kid2_ne_stand','kid2_ne_touch','kid2_se_stand','kid2_se_touch',
  'kid10_ne_stand','kid10_ne_touch','kid10_ne_sit',
  'kid10_se_stand','kid10_se_touch','kid10_se_sit'
];
const SPRITE_FILES = {
  crib: '../assets/sprites/bolcso.png',
  bed: '../assets/sprites/agy.png',
  nightstand: '../assets/sprites/ejjelisz.png',
  wardrobe: '../assets/sprites/szekreny.png',
  wardrobeEmpty: '../assets/sprites/szekreny_ures.png',
  watch: '../assets/sprites/ora.png',
  box1x1: '../assets/sprites/doboz_1x1.png',
  box1x2: '../assets/sprites/doboz_1x2.png',
  shelf1: '../assets/sprites/konyvszekr1.png',
  shelf2: '../assets/sprites/konyvszekr2.png',
  man30_ne_stand: '../assets/sprites/man30_ne_stand.png',
  man30_ne_touch: '../assets/sprites/man30_ne_touch.png',
  man30_se_stand: '../assets/sprites/man30_se_stand.png',
  man30_se_touch: '../assets/sprites/man30_se_touch.png',
  kid2_ne_stand: '../assets/sprites/kid2_ne_stand.png',
  kid2_ne_touch: '../assets/sprites/kid2_ne_touch.png',
  kid2_se_stand: '../assets/sprites/kid2_se_stand.png',
  kid2_se_touch: '../assets/sprites/kid2_se_touch.png',
  kid10_ne_stand: '../assets/sprites/kid10_ne_stand.png',
  kid10_ne_touch: '../assets/sprites/kid10_ne_touch.png',
  kid10_ne_sit: '../assets/sprites/kid10_ne_sit.png',
  kid10_se_stand: '../assets/sprites/kid10_se_stand.png',
  kid10_se_touch: '../assets/sprites/kid10_se_touch.png',
  kid10_se_sit: '../assets/sprites/kid10_se_sit.png'
};
const ROOM_FILES = { room: '../assets/room/halo.png', living: '../assets/room/nappali.png' };
const ROOM_LABELS = { room: 'Hálószoba', living: 'Nappali' };
// JSON key each room's calibration lives under -- 'room' keeps the
// original unprefixed '_room' for backward compatibility with existing
// sprites.json files, every other room gets its own '_room_<key>' block.
function roomJsonKey(k) { return k === 'room' ? '_room' : '_room_' + k; }

const DEFAULT_ROOM = {
  originPx: { x: 0, y: 0 }, gridN: 6,
  axisX: { x: 100, y: 50 }, axisY: { x: -100, y: 50 },
  tileW: 200, tileH: 100
};

let data = { _comment: 'edited with tools/anchor_editor.html' };
for (const k of SPRITES) data[k] = { anchor: {x:0.5, y:0.9}, scale: 1 };
data._room = JSON.parse(JSON.stringify(DEFAULT_ROOM));

// which room's grid the CURRENT view uses as its reference -- for a room
// plate this always matches the plate being viewed (kept in sync by
// select()); for a sprite it's independently choosable, so a new room's
// furniture can be previewed against ITS grid pitch, not the bedroom's.
let activeRoomKey = 'room';
function ensureRoomData(key) {
  const jk = roomJsonKey(key);
  if (!data[jk]) data[jk] = JSON.parse(JSON.stringify(DEFAULT_ROOM));
  return data[jk];
}

let current = null; // {key, isRoom, path}
let naturalW = 0, naturalH = 0;
// sprite-mode grid PREVIEW tile count -- deliberately separate from
// data._room.gridN (the game's actual grid size), so tweaking this for a
// sprite's preview can never corrupt the real room grid when saved.
let spritePreviewN = 2;

// 3-point calibration state: click order is origin -> +x end -> +y end
let calibrating = false;
let calPoints = []; // [{x,y}, ...] up to 3

function el(id){ return document.getElementById(id); }

function buildLists() {
  const sl = el('spriteList'); sl.innerHTML = '';
  for (const k of SPRITES) {
    const d = document.createElement('div');
    d.className = 'item'; d.dataset.key = k;
    d.innerHTML = `<img src="${SPRITE_FILES[k]}"><span>${k}</span>`;
    d.onclick = () => select(k, false, SPRITE_FILES[k]);
    sl.appendChild(d);
  }
  const rl = el('roomList'); rl.innerHTML = '';
  for (const k in ROOM_FILES) {
    const d = document.createElement('div');
    d.className = 'item'; d.dataset.key = k;
    d.innerHTML = `<img src="${ROOM_FILES[k]}"><span>${ROOM_LABELS[k] || k} (origó)</span>`;
    d.onclick = () => select(k, true, ROOM_FILES[k]);
    rl.appendChild(d);
  }
}

function buildActiveRoomSelect() {
  const sel = el('activeRoom');
  sel.innerHTML = '';
  for (const k in ROOM_FILES) {
    const opt = document.createElement('option');
    opt.value = k; opt.textContent = ROOM_LABELS[k] || k;
    sel.appendChild(opt);
  }
  sel.value = activeRoomKey;
}

function loadCustom() {
  const p = el('customPath').value.trim();
  if (!p) return;
  const key = '_custom_' + p.split('/').pop();
  data[key] = data[key] || { anchor: {x:0.5,y:0.9}, scale:1 };
  select(key, false, p.startsWith('..') || p.startsWith('http') ? p : '../' + p);
}

function select(key, isRoom, path) {
  current = { key, isRoom, path };
  stopCalibration();
  if (isRoom) { activeRoomKey = key; el('activeRoom').value = key; }
  document.querySelectorAll('.item').forEach(i => i.classList.toggle('active', i.dataset.key === key));
  el('currentName').textContent = key + (isRoom ? ' (szoba)' : '');
  const img = el('img');
  img.onload = () => {
    naturalW = img.naturalWidth; naturalH = img.naturalHeight;
    layoutMarker();
    drawGridOverlay();
  };
  img.src = path;
  refreshFields();
  el('ax').closest('label').style.display = isRoom ? 'none' : '';
  el('ay').closest('label').style.display = isRoom ? 'none' : '';
  el('ascale').closest('label').style.display = isRoom ? 'none' : '';
  el('calBtn').style.display = isRoom ? '' : 'none';
  el('marker').className = 'marker' + (isRoom ? ' origin' : '');
}

function refreshFields() {
  if (!current) return;
  const rd = ensureRoomData(activeRoomKey);
  el('gridN').value = current.isRoom ? (rd.gridN || 6) : spritePreviewN;
  el('gridNLabel').textContent = current.isRoom ? 'N (rács méret)' : 'N (előnézet cellák)';
  el('gridTW').value = (rd.tileW || 200).toFixed ? rd.tileW.toFixed(2) : rd.tileW;
  el('gridTH').value = (rd.tileH || 100).toFixed ? rd.tileH.toFixed(2) : rd.tileH;
  if (current.isRoom) {
    const r = rd.originPx;
    el('status').textContent = `origó px: (${r.x.toFixed(1)}, ${r.y.toFixed(1)})`;
  } else {
    const s = data[current.key];
    el('ax').value = s.anchor.x.toFixed(3);
    el('ay').value = s.anchor.y.toFixed(3);
    el('ascale').value = s.scale;
    el('status').textContent = `${naturalW}x${naturalH}px`;
  }
  updateJsonPreview();
}

function layoutMarker() {
  if (!current) return;
  const m = el('marker');
  m.hidden = false;
  const zoom = parseFloat(el('zoom').value);
  el('stage').style.transform = `scale(${zoom})`;
  if (current.isRoom) {
    const r = ensureRoomData(activeRoomKey).originPx;
    m.style.left = r.x + 'px';
    m.style.top = r.y + 'px';
  } else {
    const s = data[current.key];
    m.style.left = (s.anchor.x * naturalW) + 'px';
    m.style.top = (s.anchor.y * naturalH) + 'px';
  }
}

function currentAxes() {
  const r = ensureRoomData(activeRoomKey);
  if (r.axisX && r.axisY) return { axisX: r.axisX, axisY: r.axisY };
  const tw = parseFloat(el('gridTW').value) || 200, th = parseFloat(el('gridTH').value) || tw/2;
  return { axisX: { x: tw/2, y: th/2 }, axisY: { x: -tw/2, y: th/2 } };
}

function drawGridOverlay() {
  const c = el('gridOverlay');
  c.width = naturalW; c.height = naturalH;
  c.style.width = naturalW + 'px'; c.style.height = naturalH + 'px';
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  if (!current || !el('showGrid').checked) return;

  const { axisX, axisY } = currentAxes();

  if (current.isRoom) {
    const N = parseInt(el('gridN').value) || 6;
    const origin = ensureRoomData(activeRoomKey).originPx;
    function isoPt(x,y){ return [origin.x + x*axisX.x + y*axisY.x, origin.y + x*axisX.y + y*axisY.y]; }
    ctx.strokeStyle = 'rgba(0,255,255,0.8)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let gx=0; gx<=N; gx++){ const a=isoPt(gx,0), b=isoPt(gx,N); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); }
    for (let gy=0; gy<=N; gy++){ const a=isoPt(0,gy), b=isoPt(N,gy); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); }
    ctx.stroke();
    ctx.fillStyle = '#6bd1ff';
    ctx.beginPath(); ctx.arc(origin.x, origin.y, 4, 0, 7); ctx.fill();
  } else {
    // sprite mode: draw an NxN grid whose FRONT (near/bottom) corner sits
    // exactly on the anchor marker, so multi-cell furniture can be checked
    // against more than one tile. N is preview-only (spritePreviewN),
    // never data._room.gridN -- that field is the game's real grid size.
    const s = data[current.key];
    const N = spritePreviewN || 1;
    const ax = s.anchor.x * naturalW, ay = s.anchor.y * naturalH;
    // local grid coords: (N,N) must land exactly on (ax,ay)
    const originX = ax - N*axisX.x - N*axisY.x;
    const originY = ay - N*axisX.y - N*axisY.y;
    function isoPt(x,y){ return [originX + x*axisX.x + y*axisY.x, originY + x*axisX.y + y*axisY.y]; }
    ctx.strokeStyle = 'rgba(0,255,255,0.85)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let gx=0; gx<=N; gx++){ const a=isoPt(gx,0), b=isoPt(gx,N); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); }
    for (let gy=0; gy<=N; gy++){ const a=isoPt(0,gy), b=isoPt(N,gy); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,255,255,0.12)';
    ctx.beginPath();
    const c1=isoPt(0,0), c2=isoPt(N,0), c3=isoPt(N,N), c4=isoPt(0,N);
    ctx.moveTo(c1[0],c1[1]); ctx.lineTo(c2[0],c2[1]); ctx.lineTo(c3[0],c3[1]); ctx.lineTo(c4[0],c4[1]); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffcf6b';
    ctx.beginPath(); ctx.arc(ax, ay, 4, 0, 7); ctx.fill();
  }
}

// ---- dragging / placing ----
let dragging = false;
el('marker').addEventListener('mousedown', e => { dragging = true; e.preventDefault(); });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
  if (!dragging || !current) return;
  const p = eventToImagePoint(e);
  setPoint(p.x, p.y);
});
el('canvasWrap').addEventListener('click', e => {
  if (e.target.id === 'marker') return;
  if (calibrating) { handleCalibrationClick(e); return; }
  const p = eventToImagePoint(e);
  setPoint(p.x, p.y);
});

function eventToImagePoint(e) {
  const stage = el('stage');
  const zoom = parseFloat(el('zoom').value);
  const rect = stage.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / zoom, y: (e.clientY - rect.top) / zoom };
}

function setPoint(x, y) {
  if (!current) return;
  if (current.isRoom) {
    ensureRoomData(activeRoomKey).originPx = { x: Math.round(x*10)/10, y: Math.round(y*10)/10 };
  } else {
    // deliberately NOT clamped to [0,1]: a tightly-cropped sprite's true
    // ground-contact point can fall outside its own pixel bounds.
    const fx = x / naturalW, fy = y / naturalH;
    data[current.key].anchor = { x: Math.round(fx*1000)/1000, y: Math.round(fy*1000)/1000 };
  }
  layoutMarker();
  drawGridOverlay();
  refreshFields();
}

el('ax').addEventListener('input', () => { if(current && !current.isRoom){ data[current.key].anchor.x = parseFloat(el('ax').value)||0; layoutMarker(); drawGridOverlay(); }});
el('ay').addEventListener('input', () => { if(current && !current.isRoom){ data[current.key].anchor.y = parseFloat(el('ay').value)||0; layoutMarker(); drawGridOverlay(); }});
el('ascale').addEventListener('input', () => { if(current && !current.isRoom){ data[current.key].scale = parseFloat(el('ascale').value)||1; updateJsonPreview(); }});
el('zoom').addEventListener('input', () => { layoutMarker(); });
el('showGrid').addEventListener('change', drawGridOverlay);
el('gridN').addEventListener('input', () => {
  const n = parseInt(el('gridN').value) || (current && current.isRoom ? 6 : 2);
  if (current && current.isRoom) { ensureRoomData(activeRoomKey).gridN = n; updateJsonPreview(); }
  else { spritePreviewN = n; } // never touches room data -- preview only
  drawGridOverlay();
});
el('activeRoom').addEventListener('change', () => {
  activeRoomKey = el('activeRoom').value;
  refreshFields();
  drawGridOverlay();
});
el('gridTW').addEventListener('input', () => {
  const tw = parseFloat(el('gridTW').value)||0;
  const rd = ensureRoomData(activeRoomKey);
  rd.tileW = tw;
  // manual TW/TH edits always produce a symmetric diamond, overwriting any
  // previously-calibrated (possibly asymmetric) axisX/axisY
  const th = parseFloat(el('gridTH').value) || tw/2;
  rd.axisX = { x: tw/2, y: th/2 };
  rd.axisY = { x: -tw/2, y: th/2 };
  drawGridOverlay(); updateJsonPreview();
});
el('gridTH').addEventListener('input', () => {
  const th = parseFloat(el('gridTH').value)||0;
  const rd = ensureRoomData(activeRoomKey);
  rd.tileH = th;
  const tw = parseFloat(el('gridTW').value) || th*2;
  rd.axisX = { x: tw/2, y: th/2 };
  rd.axisY = { x: -tw/2, y: th/2 };
  drawGridOverlay(); updateJsonPreview();
});

// ---- 3-point axis calibration (room only) ----
// Click order: 1) origin (grid 0,0)  2) far end of +x axis (grid N,0)
// 3) far end of +y axis (grid 0,N). This measures the two axes
// independently, so they don't have to be mirror images of each other.
function toggleCalibration() {
  if (!current || !current.isRoom) return;
  calibrating ? stopCalibration() : startCalibration();
}
function startCalibration() {
  calibrating = true;
  calPoints = [];
  el('calBtn').classList.add('active');
  el('calHint').textContent = '1/3: kattints az origóra (rács (0,0) sarka)';
  el('calMarkers').innerHTML = '';
}
function stopCalibration() {
  calibrating = false;
  calPoints = [];
  el('calBtn').classList.remove('active');
  el('calHint').textContent = '';
  el('calMarkers').innerHTML = '';
}
function handleCalibrationClick(e) {
  const p = eventToImagePoint(e);
  calPoints.push(p);
  const dot = document.createElement('div');
  dot.className = 'calpt';
  dot.style.left = p.x + 'px';
  dot.style.top = p.y + 'px';
  el('calMarkers').appendChild(dot);
  if (calPoints.length === 1) {
    el('calHint').textContent = `2/3: kattints a +x tengely végére (rács (${el('gridN').value},0) sarka)`;
  } else if (calPoints.length === 2) {
    el('calHint').textContent = `3/3: kattints a +y tengely végére (rács (0,${el('gridN').value}) sarka)`;
  } else if (calPoints.length === 3) {
    const N = parseInt(el('gridN').value) || 6;
    const [o, xEnd, yEnd] = calPoints;
    const rd = ensureRoomData(activeRoomKey);
    rd.originPx = { x: Math.round(o.x*10)/10, y: Math.round(o.y*10)/10 };
    rd.axisX = { x: Math.round((xEnd.x-o.x)/N*1000)/1000, y: Math.round((xEnd.y-o.y)/N*1000)/1000 };
    rd.axisY = { x: Math.round((yEnd.x-o.x)/N*1000)/1000, y: Math.round((yEnd.y-o.y)/N*1000)/1000 };
    rd.tileW = Math.round(Math.abs(rd.axisX.x - rd.axisY.x)*100)/100;
    rd.tileH = Math.round((rd.axisX.y + rd.axisY.y)*100)/100;
    el('calHint').textContent = 'kész — axisX/axisY frissítve.';
    stopCalibration();
    layoutMarker();
    refreshFields();
    drawGridOverlay();
  }
}

function updateJsonPreview() {
  el('jsonOut').value = JSON.stringify(data, null, 2);
}

function applyLoadedJson(j) {
  data = Object.assign({ _room: JSON.parse(JSON.stringify(DEFAULT_ROOM)) }, j);
  for (const k of SPRITES) if (!data[k]) data[k] = { anchor:{x:0.5,y:0.9}, scale:1 };
  for (const rk in ROOM_FILES) {
    const rd = ensureRoomData(rk);
    if (!rd.gridN) rd.gridN = 6;
    if (!rd.tileW) rd.tileW = 200;
    if (!rd.axisX || !rd.axisY) {
      const tw = rd.tileW, th = rd.tileH || tw/2;
      rd.axisX = { x: tw/2, y: th/2 };
      rd.axisY = { x: -tw/2, y: th/2 };
    }
  }
  if (current) refreshFields();
  layoutMarker();
  drawGridOverlay();
  updateJsonPreview();
}

async function loadExisting() {
  try {
    const res = await fetch('../assets/sprites.json?_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    applyLoadedJson(await res.json());
    el('jsonStatus').textContent = 'betöltve a szerverről.';
  } catch (e) {
    el('jsonStatus').textContent = 'nem sikerült a szerverről betölteni (' + e.message + ') — ha file:// -ből nyitottad meg, ez a böngésző CORS-szabálya miatt várható; használd a "megnyitás lemezről" gombot, vagy indítsd a tools/anchor_editor.html-t is a helyi szerveren keresztül.';
  }
}

el('fileOpen').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    applyLoadedJson(JSON.parse(text));
    el('jsonStatus').textContent = `betöltve: ${file.name}`;
  } catch (err) {
    el('jsonStatus').textContent = 'hibás JSON fájl: ' + err.message;
  }
});

function copyJson() {
  updateJsonPreview();
  navigator.clipboard.writeText(el('jsonOut').value).then(() => {
    el('jsonStatus').textContent = 'vágólapra másolva.';
  });
}

function downloadJson() {
  updateJsonPreview();
  const blob = new Blob([el('jsonOut').value], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sprites.json';
  a.click();
}

buildLists();
buildActiveRoomSelect();
updateJsonPreview();
select('crib', false, SPRITE_FILES.crib);
loadExisting();
</script>
